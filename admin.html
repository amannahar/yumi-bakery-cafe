<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YUMI Admin</title><style>body{font-family:Arial,sans-serif;background:#fbf1e6;color:#351c19;margin:0}header{padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e6d2c3;background:#fffaf4}h1{font-family:Georgia,serif;margin:0}.wrap{max-width:1100px;margin:30px auto;padding:0 18px}.panel{background:#fffaf4;border:1px solid #e6d2c3;border-radius:16px;padding:20px;margin-bottom:18px}input,button,select{padding:10px;border-radius:9px;border:1px solid #dfc9b9}input{width:min(420px,100%)}button{background:#6b2823;color:#fff;border:0;cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap}.order{padding:15px 0;border-bottom:1px solid #eadbd0;display:grid;grid-template-columns:1fr auto;gap:10px}.muted{color:#806d64;font-size:12px}.badge{background:#f3dfcf;padding:5px 8px;border-radius:999px;font-size:11px}.items{font-size:12px;margin-top:8px}.error{color:#a52f27}</style></head><body><header><h1>YUMI · Admin</h1><span class="muted">Order management</span></header><div class="wrap"><div class="panel"><h3>Admin access</h3><div class="row"><input id="key" type="password" placeholder="Admin key"><button onclick="load()">Open dashboard</button></div><p id="msg" class="muted"></p></div><div class="panel"><div class="row" style="justify-content:space-between"><h2>Latest orders</h2><button onclick="load()">Refresh</button></div><div id="orders" class="muted">Enter the admin key to load orders.</div></div></div><script>const api='/api/admin/orders';function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function load(){const key=document.getElementById('key').value;localStorage.setItem('yumi-admin-key',key);const box=document.getElementById('orders');box.innerHTML='Loading...';try{const r=await fetch(api,{headers:{'X-Admin-Key':key}});if(!r.ok)throw new Error('Unauthorized');const data=await r.json();box.innerHTML=data.length?data.map(o=>`<div class="order"><div><b>#${esc(o.orderNumber)}</b> <span class="badge">${esc(o.status)}</span><div class="muted">${esc(o.paymentStatus)} · ${esc(o.total)}</div><div class="items">${o.items.map(i=>`${esc(i.quantity)}× ${esc(i.name)} (${esc(i.size)})`).join('<br>')}</div></div><div><select onchange="status('${esc(o.orderNumber)}',this.value)"><option>RECEIVED</option><option>PREPARING</option><option>READY</option><option>OUT_FOR_DELIVERY</option><option>COMPLETED</option><option>CANCELLED</option></select></div></div>`).join(''):'No orders yet.'}catch(e){box.innerHTML='<span class="error">Could not load orders. Check the admin key.</span>'}}async function status(n,v){const key=document.getElementById('key').value;await fetch('/api/admin/orders/'+encodeURIComponent(n)+'/status?value='+encodeURIComponent(v),{method:'PATCH',headers:{'X-Admin-Key':key}});load()}document.getElementById('key').value=localStorage.getItem('yumi-admin-key')||'';</script></body></html>
