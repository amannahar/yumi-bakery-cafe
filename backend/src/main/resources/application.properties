spring.application.name=yumi-cafe-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/yumi}
spring.datasource.username=${DB_USERNAME:yumi}
spring.datasource.password=${DB_PASSWORD:yumi}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
management.endpoints.web.exposure.include=health,info
app.admin.key=${ADMIN_KEY:change-me-before-production}
app.delivery.fee=${DELIVERY_FEE:30}
app.free.delivery.threshold=${FREE_DELIVERY_THRESHOLD:299}
app.tax.rate=${TAX_RATE:0.05}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
