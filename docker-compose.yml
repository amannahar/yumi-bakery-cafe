services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yumi
      POSTGRES_USER: yumi
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yumi-change-me}
    volumes: [yumi_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U yumi -d yumi"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/yumi
      DB_USERNAME: yumi
      DB_PASSWORD: ${DB_PASSWORD:-yumi-change-me}
      ADMIN_KEY: ${ADMIN_KEY:-replace-this-admin-key}
      DDL_AUTO: update
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      db: {condition: service_healthy}
  web:
    build: .
    ports: ["3000:80"]
    depends_on: [api]
volumes:
  yumi_pgdata:
